<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面未找到 · shiro</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main class="error-wrap">
    <div>
      <div class="error-code gradient-text">404</div>
      <h1 style="font-size:24px;margin-bottom:10px;">哎呀，这个页面走丢了</h1>
      <p class="section-desc" style="margin:0 auto 28px;">你访问的页面不存在，可能已被移动或删除。</p>
      <a href="index.html" class="btn btn-primary">回到首页</a>
    </div>
  </main>
</body>
</html>
