      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {

</head>
<body>

  <header class="site-header" id="siteHeader">
    <div class="container nav-wrap">
      <a href="index.html" class="brand">shiro<span class="dot">.</span></a>
      <nav class="nav" id="nav">
        <a href="index.html" class="nav-link">首页</a>
        <a href="projects.html" class="nav-link">项目</a>
        <a href="blog.html" class="nav-link">博客</a>
        <a href="contact.html" class="nav-link active">联系</a>
      </nav>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="切换深浅色主题">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="section" style="padding-top:48px;">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-eyebrow">Contact</span>
          <h2 class="section-title">联系我</h2>
          <p class="section-desc">把下面的邮箱、GitHub 换成你自己的真实信息。</p>
        </div>

        <div class="contact-wrap">
          <ul class="contact-list">
            <li>
              <a class="contact-item reveal" href="mailto:hello@example.com">
                <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
                <div>
                  <div class="label">邮箱</div>
                  <div class="value">hello@example.com</div>
                </div>
              </a>
            </li>
            <li>
              <a class="contact-item reveal" href="https://github.com/shiro0215" target="_blank" rel="noopener">
                <span class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.78 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.25 5.66.41.35.77 1.04.77 2.1 0 1.52-.01 2.74-.01 3.11 0 .31.21.68.8.56A10.52 10.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg></span>
                <div>
                  <div class="label">GitHub</div>
                  <div class="value">github.com/shiro0215</div>
                </div>
              </a>
            </li>
            <li>
              <div class="contact-item reveal">
                <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
                <div>
                  <div class="label">微信 / 其他</div>
                  <div class="value">你的微信号（占位）</div>
                </div>
              </div>
            </li>
          </ul>

          <form class="form reveal" id="contactForm">
            <h3 style="font-size:18px;">给我留言</h3>
            <div>
              <label for="name">你的称呼</label>
              <input type="text" id="name" name="name" placeholder="怎么称呼你" required>
            </div>
            <div>
              <label for="message">想说的话</label>
              <textarea id="message" name="message" placeholder="写点什么吧" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">发送（会唤起邮箱）</button>
            <p class="form-note">演示表单：点击后会用你的邮箱客户端打开一封写好的邮件。上线后你也可以接入真实后端。</p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="brand">shiro<span class="dot">.</span></div>
      <p>© <span id="year">2026</span> shiro · 用 ❤️ 与代码搭建</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    // 演示表单：把内容拼成 mailto 链接，唤起用户邮箱客户端
    document.getElementById("contactForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var name = document.getElementById("name").value.trim();
      var msg = document.getElementById("message").value.trim();
      var subject = encodeURIComponent("来自 " + name + " 的留言");
      var body = encodeURIComponent(msg);
      window.location.href = "mailto:hello@example.com?subject=" + subject + "&body=" + body;
    });
  </script>
</body>
</html>
